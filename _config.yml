about_content: | # this will include new lines to allow paragraphs Write an awesome description about yourself here, this supports markdown, so you can add [links](http://foobar.com) and highlight things <mark>like this</mark>.
  I am a PhD student in mathematics at [Institut de mathématiques de Toulouse](https://www.math.univ-toulouse.fr/), France.

  I was born on October 26th, 1998. However, you may already know that many Chinese people use a different [calendar](https://en.wikipedia.org/wiki/Chinese_calendar), so my birthday 🎂 'changes' every year.

  I like to write ✎, but mainly in [Chinese](https://jingmatrix.github.io/zh/blog/2023-12-18-galaxy-iss).  Currently my [English Blogs](https://jingmatrix.github.io/en/writing/2022-10-04-pdf-djvu-epub) focus on:
    - Computer programs (my second passion after mathematics)
    - Excerpts from mathematical articles
  
  My collection of math notes and E-books is shared via [Google Drive](https://drive.google.com/drive/folders/1O279emuW9Z1LGmQ94fbRYfjZoxT8bpwU?usp=sharing).
   
  In a sense, my taste is a bit retro:
    - For musician 🎶, I prefer [Beethoven](https://fr.wikipedia.org/wiki/Ludwig_van_Beethoven).
    - For director 🎥, I prefer [Béla Tarr](https://fr.wikipedia.org/wiki/B%C3%A9la_Tarr), all of his movies are Black-and-White.
    - For writer 📘, I prefer [Nietzsche](https://en.wikipedia.org/wiki/Friedrich_Nietzsche), especially his [Par-delà le bien et le mal](https://fr.wikipedia.org/wiki/Par-del%C3%A0_le_bien_et_le_mal).

